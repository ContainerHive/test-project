schemaVersion: 2.0.0
commandTests:
  - name: "bash-installed"
    command: "/bin/bash"
    args: ["--version"]
    exitCode: 0
  - name: "curl-installed"
    command: "/usr/bin/curl"
    args: ["--version"]
    exitCode: 0

fileExistenceTests:
  - name: "ca-certificates-exist"
    path: "/etc/ssl/certs/ca-certificates.crt"
    shouldExist: true
  - name: "zoneinfo-exists"
    path: "/usr/share/zoneinfo/Europe/Berlin"
    shouldExist: true
