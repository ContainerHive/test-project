  stage: base-ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "_base/images/base-ci/**/*"
          - "gitlab/.pre-commit-config.yaml"
          - "gitlab/hive.yml"
          - "gitlab/hive.yaml"
          - "gitlab/container-hive.yml"
          - "gitlab/container-hive.yaml"
