report:
  image:
    name: ghcr.io/containerhive/containerhive:0206629
    entrypoint: [""]
  stage: report
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  needs:
    - generate
    - job: build-base-ci-amd64
      optional: true
    - job: build-base-ci-arm64
      optional: true
    - job: build-base-deployment-amd64
      optional: true
    - job: build-base-deployment-arm64
      optional: true
    - job: build-chiseled-tools-amd64
      optional: true
    - job: build-chiseled-tools-arm64
      optional: true
    - job: build-deterministic-zip-amd64
      optional: true
    - job: build-golang-amd64
      optional: true
    - job: build-nixos-node-amd64
      optional: true
    - job: build-node-amd64
      optional: true
    - job: build-dotnet-runtime-amd64
      optional: true
    - job: build-go-ci-amd64
      optional: true
  script:
    - ch -p gitlab report
    - ch -p gitlab report --json
    - mkdir -p public
    - mv gitlab/dist/report.html public/index.html
    - mv gitlab/dist/report.json public/report.json
  artifacts:
    paths:
      - public/
    expose_as: "CH Report"
    expire_in: 1 week

pages:
  needs:
    - report
  script:
    - echo "Deploy happens via convention on job name"
  stage: pages
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
