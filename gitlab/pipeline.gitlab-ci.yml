variables:
  SNAPSHOT_ID: ${CI_MERGE_REQUEST_IID}

before_script:
  - echo "$CI_REGISTRY_PASSWORD" | ch -p gitlab login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  - echo "$CONTAINER_HIVE_REGISTRY_PASSWORD" | ch -p gitlab login -u "$CONTAINER_HIVE_REGISTRY_USERNAME" --password-stdin "registry.gitlab.com"

# === BASE TEMPLATES ===

.build:
  image:
    name: ghcr.io/containerhive/containerhive:ea01911
    entrypoint: [""]
  services:
    - name: moby/buildkit:v0.34.0
      alias: buildkitd
      command: ["--addr", "tcp://0.0.0.0:8372"]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    BUILDKIT_HOST: tcp://buildkitd:8372
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab wait --buildkitd
    - ch -p gitlab build ${IMAGE_NAME} --platform ${PLATFORM} --build-id "$SNAPSHOT_ID"
    - ch -p gitlab sbom ${IMAGE_NAME} --platform ${PLATFORM} --build-id "$SNAPSHOT_ID"

.build-amd64:
  extends: .build

.build-arm64:
  extends: .build

.manifest:
  image:
    name: ghcr.io/containerhive/containerhive:ea01911
    entrypoint: [""]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab finalize ${IMAGE_NAME} --build-id "$SNAPSHOT_ID"

.test:
  image:
    name: ghcr.io/containerhive/containerhive:ea01911
    entrypoint: [""]
  services:
    - name: docker:dind
      alias: dind
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    DOCKER_HOST: tcp://dind:2375
    DOCKER_TLS_CERTDIR: ""
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab wait --docker-socket
    - ch -p gitlab test ${IMAGE_NAME} --platform ${PLATFORM} --build-id "$SNAPSHOT_ID"

.test-amd64:
  extends: .test

.test-arm64:
  extends: .test


# === GENERATE ===
generate:
  image:
    name: ghcr.io/containerhive/containerhive:ea01911
    entrypoint: [""]
  stage: generate
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull-push
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab generate --build-id "$SNAPSHOT_ID"
  artifacts:
    paths:
      - gitlab/dist/
    expire_in: 1 week

lint:
  stage: lint
  needs:
    - generate
  image:
    name: ghcr.io/containerhive/containerhive:ea01911
    entrypoint: [""]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab lint --format codeclimate=gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

