# Auto-generated by ContainerHive
# Do not edit - regenerate with: ch --project gitlab template ci --provider gitlab --output gitlab/pipeline.gitlab-ci.yml --image-name ghcr.io/containerhive/containerhive
# tag_ranges resolved to 13 shard unit(s) - regenerate if this changes.

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - generate
  - lint
  - base-ci
  - base-deployment
  - chiseled-tools
  - deterministic-zip
  - golang
  - nixos-node
  - node
  - dotnet-runtime
  - go-ci
  - report
  - pages

variables:
  SNAPSHOT_ID: ${CI_MERGE_REQUEST_IID}

before_script:
  - echo "$CI_REGISTRY_PASSWORD" | ch -p gitlab login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  - echo "$CONTAINER_HIVE_REGISTRY_PASSWORD" | ch -p gitlab login -u "$CONTAINER_HIVE_REGISTRY_USERNAME" --password-stdin "registry.gitlab.com"

# === BASE TEMPLATES ===

.build:
  image:
    name: ghcr.io/containerhive/containerhive:0206629
    entrypoint: [""]
  services:
    - name: ghcr.io/containerhive/helper-images/buildkit:v0.34
      alias: buildkitd
      command: ["--addr", "tcp://0.0.0.0:8372"]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    BUILDKIT_HOST: tcp://buildkitd:8372
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab wait --buildkitd
    - ch -p gitlab build ${IMAGE_NAME} --platform ${PLATFORM} --build-id "$SNAPSHOT_ID"
    - ch -p gitlab sbom ${IMAGE_NAME} --platform ${PLATFORM} --build-id "$SNAPSHOT_ID"

.build-amd64:
  extends: .build

.build-arm64:
  extends: .build

.manifest:
  image:
    name: ghcr.io/containerhive/containerhive:0206629
    entrypoint: [""]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab finalize ${IMAGE_NAME} --build-id "$SNAPSHOT_ID"

.test:
  image:
    name: ghcr.io/containerhive/containerhive:0206629
    entrypoint: [""]
  services:
    - name: ghcr.io/containerhive/helper-images/dind-rootless:29.9
      alias: dind
      command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    DOCKER_HOST: tcp://dind:2375
    DOCKER_TLS_CERTDIR: ""
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab wait --docker-socket
    - ch -p gitlab test ${IMAGE_NAME} --platform ${PLATFORM} --build-id "$SNAPSHOT_ID"

.test-amd64:
  extends: .test

.test-arm64:
  extends: .test


# === GENERATE ===
generate:
  image:
    name: ghcr.io/containerhive/containerhive:0206629
    entrypoint: [""]
  stage: generate
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull-push
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
    # Change detection diffs against the default branch, which needs its
    # history next to the pipeline commit.
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --prune --quiet +refs/heads/$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH
  script:
    - ch -p gitlab generate --build-id "$SNAPSHOT_ID"
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ -n "$CI_COMMIT_BRANCH" ] && [ "$CI_COMMIT_BRANCH" != "$CI_DEFAULT_BRANCH" ]; then
        ch -p gitlab changes --base "refs/remotes/origin/$CI_DEFAULT_BRANCH" --unmatched ignore --strict --write
      fi
  artifacts:
    paths:
      - gitlab/dist/
    expire_in: 1 week

lint:
  stage: lint
  needs:
    - generate
  image:
    name: ghcr.io/containerhive/containerhive:0206629
    entrypoint: [""]
  cache:
    key: ch-versions
    paths:
      - gitlab/.ch-cache/
    policy: pull
  variables:
    CONTAINER_HIVE_CACHE_DIR: gitlab/.ch-cache
  script:
    - ch -p gitlab lint --format codeclimate=gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

